# Optional. Day-to-day development runs locally without Docker (see README, section 1).
# Builds the images for the hosted swarm stack (stack.yml), normally in CI:
#   REGISTRY=registry.example.com/apc TAG=1 docker compose build
#   REGISTRY=registry.example.com/apc TAG=1 docker compose push
# Only Storybook:  docker compose build storybook
# Try the images on a machine with Docker:  docker compose up --build

services:
  composer:
    image: ${REGISTRY:-apc}/composer:${TAG:-latest}
    build: { context: ., dockerfile: docker/composer.Dockerfile }
    ports: ["3001:3000"]
    volumes: ["pages:/data"]

  storybook:
    image: ${REGISTRY:-apc}/storybook:${TAG:-latest}
    build: { context: ., dockerfile: docker/storybook.Dockerfile }
    ports: ["6006:80"]

volumes:
  pages:
